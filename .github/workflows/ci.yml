name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q radar desktop.py translate_loop.py
      - name: Import smoke test
        run: |
          python -c "from radar import config, db, feed, llm, web, collect, demo, github, taxonomy"
          python -c "from radar import demo; items = demo.load_items(); assert items, 'demo data empty'; print(len(items), 'demo items')"
      - name: Secret scan
        run: |
          if git grep -nE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}"; then
            echo "疑似密钥被提交"; exit 1
          fi
          echo "no secrets"
      - name: Config defaults
        run: |
          python -c "from radar import config; cfg = config.llm_config(); print(cfg['provider'], cfg['chat_url']); assert cfg['chat_url'].endswith('/chat/completions')"
