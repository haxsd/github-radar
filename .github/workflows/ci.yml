name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q radar desktop.py translate_loop.py
      - name: Lint (hard errors)
        run: |
          python -m pip install ruff
          ruff check .
      - name: Import smoke test
        run: |
          python -c "from radar import config, db, feed, llm, web, collect, demo, github, taxonomy, update"
          python -c "from radar import demo; items = demo.load_items(); assert items, 'demo data empty'; print(len(items), 'demo items')"
      - name: Frontend syntax check
        run: |
          for f in radar/static/js/*.js; do node --check "$f"; done
      - name: Behavior tests
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        run: |
          if git grep -nE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}"; then
            echo "疑似密钥被提交"; exit 1
          fi
          echo "no secrets"
      - name: Config defaults
        run: |
          python -c "from radar import config; cfg = config.llm_config(); print(cfg['provider'], cfg['chat_url']); assert cfg['chat_url'].endswith('/chat/completions')"
