{% extends "base.html" %}
{% block title %}信息流 · StarScout{% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/feed.css') }}">
{% endblock %}

{% block content %}
<div class="stage">
  <div class="filtersrow">
    <div class="filters" id="filters" role="tablist" aria-label="按领域筛选"></div>
    <button type="button" class="filters-more" id="openPanel" aria-haspopup="dialog">组合筛选</button>
  </div>
  <div class="activefilters" id="activeFilters"></div>

  <div class="listhead">
    <span class="listcount" id="listcount">加载中…</span>
    <span class="listtools">
      <button type="button" class="btn ghost sm" id="helpBtn" aria-haspopup="dialog">快捷键 <span class="kbd">?</span></button>
      <button type="button" class="btn sm" id="refreshBtn">换一批 <span class="kbd">R</span></button>
    </span>
  </div>
  <div class="rows" id="rows" aria-live="polite"></div>
  <div class="sentinel" id="sentinel"></div>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="项目详情">
  <div class="dbox glass" id="dbox" tabindex="-1"></div>
</div>

<div class="fpanel" id="fpanel" role="dialog" aria-modal="true" aria-label="组合筛选">
  <div class="fbox glass">
    <div id="fpanelBody"></div>
    <div class="fpanel-foot">
      <div class="profileline" id="profileline"></div>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn ghost" onclick="clearFilters()">清空</button>
        <button type="button" class="btn primary" onclick="applyFilters()">应用筛选</button>
      </div>
    </div>
  </div>
</div>

<div class="help" id="help" role="dialog" aria-modal="true" aria-label="快捷键">
  <div class="helpbox glass" tabindex="-1">
    <h3>快捷键</h3>
    <div class="helpgrid">
      <b>↓ / ↑</b><span>选择上下行</span>
      <b>Enter</b><span>打开当前行详情</span>
      <b>S</b><span>收藏</span>
      <b>X</b><span>跳过（同类降权）</span>
      <b>L</b><span>感兴趣</span>
      <b>O</b><span>打开 GitHub</span>
      <b>R</b><span>换一批</span>
      <b>F</b><span>组合筛选</span>
      <b>1~9 / 0</b><span>快速切领域 / 取消筛选</span>
      <b>Esc</b><span>关闭弹层</span>
      <b>?</b><span>显示/隐藏这个帮助</span>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/feed.js') }}"></script>
{% endblock %}
