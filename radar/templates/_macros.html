{% macro icon(name, cls='') -%}
<svg class="i{% if cls %} {{ cls }}{% endif %}" viewBox="0 0 24 24" aria-hidden="true">
{%- if name == 'radar' -%}
  <circle cx="12" cy="12" r="2.4"/><path d="M12 3a9 9 0 0 1 9 9"/><path d="M12 6.6a5.4 5.4 0 0 1 5.4 5.4"/><path d="M3 12a9 9 0 0 0 9 9"/>
{%- elif name == 'bookmark' -%}
  <path d="M6 4h12v17l-6-4-6 4z"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'chart' -%}
  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'download' -%}
  <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
{%- elif name == 'edit' -%}
  <path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 5l4 4"/>
{%- elif name == 'trash' -%}
  <path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/>
{%- elif name == 'eye' -%}
  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>
{%- elif name == 'check' -%}
  <path d="M20 6L9 17l-5-5"/>
{%- elif name == 'external' -%}
  <path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/>
{%- elif name == 'filter' -%}
  <path d="M4 5h16l-6 7v6l-4 2v-8z"/>
{%- elif name == 'star' -%}
  <path d="M12 3l2.7 6.2 6.3.6-4.8 4.3 1.4 6.1-5.6-3.3-5.6 3.3 1.4-6.1L3 9.8l6.3-.6z"/>
{%- elif name == 'github' -%}
  <path d="M9 19c-4 1.5-4-2-6-2.5"/><path d="M15 21v-3.5c0-1 .1-1.5-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.1s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C7.2 2.6 6.2 3 6.2 3a4.2 4.2 0 0 0-.1 3.1A4.6 4.6 0 0 0 4.7 9.3c0 4.5 2.7 5.7 5.5 6-.4.4-.5.9-.5 1.5V21"/>
{%- elif name == 'sparkles' -%}
  <path d="M12 3l1.7 4.5L18 9.2l-4.3 1.7L12 15.4l-1.7-4.5L6 9.2l4.3-1.7z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>
{%- elif name == 'wifi' -%}
  <path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.4" r=".9"/>
{%- elif name == 'image' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.4"/><path d="M21 15l-5-5L5 20"/>
{%- elif name == 'database' -%}
  <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>
{%- elif name == 'save' -%}
  <path d="M5 3h11l5 5v13H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/>
{%- elif name == 'chevron' -%}
  <path d="M6 9l6 6 6-6"/>
{%- elif name == 'shield' -%}
  <path d="M12 3l8 3v6c0 4.6-3.4 7.8-8 9-4.6-1.2-8-4.4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro empty(title, text, icon_name='radar', cls='') -%}
<div class="empty{% if cls %} {{ cls }}{% endif %}">
  <div class="empty-icon">{{ icon(icon_name, 'i-lg') }}</div>
  <h2>{{ title }}</h2>
  <p class="muted">{{ text }}</p>
</div>
{%- endmacro %}
